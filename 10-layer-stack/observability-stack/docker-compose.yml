# NightForge observability stack — metrics only.
#
# RETIRED 2026-10-19 (bead nightforge-aaj): the Langfuse services and the
# OTel Collector were removed from this file. The canonical Langfuse runs
# outside this repo on 127.0.0.1:50598 (docker project `langfuse`, compose at
# ~/Documents/ai-lab-vault/20-Tools/agentsview-langfuse-setup/langfuse/).
# See PORT-REGISTRY-PROPOSAL.md for the port rows this stack still needs.
#
# What remains measures real things and is not duplicated by the canonical
# Langfuse (which exposes no /metrics endpoint at all):
#   prometheus    — scrapes node-exporter
#   node-exporter — host CPU/memory/disk/load
#   grafana       — visualises the Prometheus datasource
#
# No service is started by this file. The operator starts the stack after
# creating .env from .env.example.
#
# Secrets: the only secret left is GRAFANA_ADMIN_PASSWORD, and it is
# required (${VAR:?...}) — compose fails at parse time when it is unset or
# empty rather than starting Grafana with a placeholder password.
name: cr1mson-observability

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.2:31745
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "31746"
      # The username is not a secret — a default is harmless and the admin
      # account name is operator-facing, not confidential.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # The password IS a secret. ${VAR:?...} makes compose refuse to render
      # the file when the variable is unset or empty, so a missing .env can
      # never silently start Grafana with a placeholder credential.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required - copy .env.example to .env and set a real secret}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - ./nightforge-metrics.json:/var/lib/grafana/dashboards/nightforge-metrics.json:ro

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --web.listen-address=127.0.0.1:31750
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave

volumes:
  prometheus_data:
  grafana_data:
